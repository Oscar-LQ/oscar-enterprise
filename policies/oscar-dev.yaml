version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  # /etc/oscar/oscar.env carries OSCAR_* secrets and is bind-mounted into
  # the sandbox by the host launcher (out-of-band from this policy — see
  # ADR 025). /etc is already in the Landlock read-only allowlist above;
  # the explicit entry below makes intent grep-able and survives any
  # future narrowing of the /etc allowlist.
  - /etc/oscar/oscar.env
  - /var/log
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  claude_code:
    name: claude-code
    endpoints:
    - host: api.anthropic.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      access: full
    - host: statsig.anthropic.com
      port: 443
    - host: sentry.io
      port: 443
    - host: raw.githubusercontent.com
      port: 443
    - host: platform.claude.com
      port: 443
    - host: storage.googleapis.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-only
    - host: mcp-proxy.anthropic.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      access: read-write
    binaries:
    - path: /usr/local/bin/claude
    - path: /usr/bin/node
    - path: /sandbox/.local/share/claude/versions/**
  claude_web_fetch:
    name: claude-web-fetch
    endpoints:
    # Code hosting / raw content
    - host: github.com
      port: 443
    - host: "**.github.com"
      port: 443
    - host: "**.githubusercontent.com"
      port: 443
    - host: "**.github.io"
      port: 443
    # Read-the-docs family
    - host: "**.readthedocs.io"
      port: 443
    - host: "**.readthedocs.org"
      port: 443
    - host: "**.rtfd.io"
      port: 443
    - host: "**.rtfd.org"
      port: 443
    # Python ecosystem
    - host: python.org
      port: 443
    - host: "**.python.org"
      port: 443
    - host: pypi.org
      port: 443
    - host: "**.pypi.org"
      port: 443
    - host: "**.pythonhosted.org"
      port: 443
    - host: "**.pydata.org"
      port: 443
    - host: fastapi.tiangolo.com
      port: 443
    - host: "**.fastapi.tiangolo.com"
      port: 443
    - host: djangoproject.com
      port: 443
    - host: "**.djangoproject.com"
      port: 443
    # Rust ecosystem
    - host: rust-lang.org
      port: 443
    - host: "**.rust-lang.org"
      port: 443
    - host: crates.io
      port: 443
    - host: "**.crates.io"
      port: 443
    - host: docs.rs
      port: 443
    - host: "**.docs.rs"
      port: 443
    # Node / npm ecosystem
    - host: npmjs.com
      port: 443
    - host: "**.npmjs.com"
      port: 443
    - host: npmjs.org
      port: 443
    - host: "**.npmjs.org"
      port: 443
    - host: nodejs.org
      port: 443
    - host: "**.nodejs.org"
      port: 443
    # Go ecosystem
    - host: go.dev
      port: 443
    - host: "**.go.dev"
      port: 443
    - host: golang.org
      port: 443
    - host: "**.golang.org"
      port: 443
    - host: proxy.golang.org
      port: 443
    - host: sum.golang.org
      port: 443
    # Community Q&A and blogs
    - host: stackoverflow.com
      port: 443
    - host: "**.stackoverflow.com"
      port: 443
    - host: stackexchange.com
      port: 443
    - host: "**.stackexchange.com"
      port: 443
    - host: stackoverflow.blog
      port: 443
    - host: "**.stackoverflow.blog"
      port: 443
    - host: dev.to
      port: 443
    - host: "**.dev.to"
      port: 443
    - host: medium.com
      port: 443
    - host: "**.medium.com"
      port: 443
    - host: "**.substack.com"
      port: 443
    # Web standards / MDN
    - host: mozilla.org
      port: 443
    - host: "**.mozilla.org"
      port: 443
    - host: developer.mozilla.org
      port: 443
    - host: "**.mdn.dev"
      port: 443
    - host: w3.org
      port: 443
    - host: "**.w3.org"
      port: 443
    # AI/ML ecosystem
    - host: anthropic.com
      port: 443
    - host: "**.anthropic.com"
      port: 443
    - host: openai.com
      port: 443
    - host: "**.openai.com"
      port: 443
    - host: huggingface.co
      port: 443
    - host: "**.huggingface.co"
      port: 443
    - host: langchain.com
      port: 443
    - host: "**.langchain.com"
      port: 443
    - host: langchain-ai.github.io
      port: 443
    - host: langgraph.dev
      port: 443
    - host: "**.langgraph.dev"
      port: 443
    - host: "**.pinecone.io"
      port: 443
    - host: "**.weaviate.io"
      port: 443
    # Search engines (landing pages, not full crawl)
    - host: duckduckgo.com
      port: 443
    - host: "**.duckduckgo.com"
      port: 443
    - host: google.com
      port: 443
    - host: "**.google.com"
      port: 443
    - host: bing.com
      port: 443
    - host: "**.bing.com"
      port: 443
    # Cloud / infra docs
    - host: "**.aws.amazon.com"
      port: 443
    - host: "**.docs.aws.amazon.com"
      port: 443
    - host: "**.cloud.google.com"
      port: 443
    - host: "**.azure.com"
      port: 443
    - host: "**.microsoft.com"
      port: 443
    - host: "**.cloudflare.com"
      port: 443
    - host: "**.vercel.app"
      port: 443
    - host: "**.netlify.app"
      port: 443
    # Misc dev tools / OSS project homes
    - host: "**.jetbrains.com"
      port: 443
    - host: "**.sourceforge.net"
      port: 443
    - host: "**.apache.org"
      port: 443
    - host: "**.gnu.org"
      port: 443
    - host: "**.freebsd.org"
      port: 443
    - host: "**.kernel.org"
      port: 443
    binaries:
    - path: /usr/local/bin/claude
    - path: /sandbox/.local/share/claude/versions/**
    - path: /usr/bin/node
  codex:
    name: codex
    endpoints:
    - host: api.openai.com
      port: 443
    - host: auth.openai.com
      port: 443
    - host: chatgpt.com
      port: 443
    binaries:
    - path: /usr/bin/codex
    - path: /usr/bin/node
    - path: /usr/lib/node_modules/@openai/**
  copilot:
    name: copilot
    endpoints:
    - host: github.com
      port: 443
    - host: api.github.com
      port: 443
    - host: api.githubcopilot.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
    - host: api.individual.githubcopilot.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
    - host: api.business.githubcopilot.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
    - host: api.enterprise.githubcopilot.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
    - host: copilot-proxy.githubusercontent.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
    - host: origin-tracker.githubusercontent.com
      port: 443
    - host: telemetry.enterprise.githubcopilot.com
      port: 443
    - host: default.exp-tas.com
      port: 443
    - host: release-assets.githubusercontent.com
      port: 443
    binaries:
    - path: /usr/bin/copilot
    - path: /usr/lib/node_modules/@github/copilot/node_modules/@github/**/copilot
  cursor:
    name: cursor
    endpoints:
    - host: cursor.blob.core.windows.net
      port: 443
    - host: api2.cursor.sh
      port: 443
    - host: repo.cursor.sh
      port: 443
    - host: download.cursor.sh
      port: 443
    - host: cursor.download.prss.microsoft.com
      port: 443
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/wget
    - path: /sandbox/.cursor-server/**
  github_rest_api:
    name: github-rest-api
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      access: read-only
    binaries:
    - path: /usr/local/bin/claude
    - path: /usr/bin/gh
  github_ssh:
    name: github-ssh
    endpoints:
    - host: github.com
      port: 22
    binaries:
    - path: /usr/bin/ssh
    - path: /usr/bin/nc.openbsd
  github_ssh_over_https:
    name: github-ssh-over-https
    endpoints:
    - host: github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**/info/refs*
      - allow:
          method: POST
          path: /**/git-upload-pack
    binaries:
    - path: /usr/bin/git
  minimax:
    name: minimax
    endpoints:
    - host: api.minimax.io
      port: 443
    binaries:
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.venv/bin/python3
    - path: /app/.venv/bin/python
    - path: /app/.venv/bin/python3
    - path: /sandbox/.uv/python/**
    - path: /usr/bin/curl
  openrouter:
    name: openrouter
    endpoints:
    - host: openrouter.ai
      port: 443
    binaries:
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.venv/bin/python3
    - path: /app/.venv/bin/python
    - path: /app/.venv/bin/python3
    - path: /sandbox/.uv/python/**
    - path: /usr/bin/curl
  nvidia_inference:
    name: nvidia-inference
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
    binaries:
    - path: /usr/bin/curl
    - path: /bin/bash
    - path: /usr/local/bin/opencode
  opencode:
    name: opencode
    endpoints:
    - host: registry.npmjs.org
      port: 443
    - host: opencode.ai
      port: 443
    - host: integrate.api.nvidia.com
      port: 443
    binaries:
    - path: /usr/lib/node_modules/opencode-ai/bin/.opencode
    - path: /usr/bin/node
    - path: /usr/local/bin/opencode
  pypi:
    name: pypi
    endpoints:
    - host: pypi.org
      port: 443
    - host: files.pythonhosted.org
      port: 443
    - host: github.com
      port: 443
    - host: objects.githubusercontent.com
      port: 443
    - host: api.github.com
      port: 443
    - host: downloads.python.org
      port: 443
    binaries:
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.venv/bin/python3
    - path: /sandbox/.venv/bin/pip
    - path: /app/.venv/bin/python
    - path: /app/.venv/bin/python3
    - path: /app/.venv/bin/pip
    - path: /usr/local/bin/uv
    - path: /sandbox/.uv/python/**
  vscode:
    name: vscode
    endpoints:
    - host: update.code.visualstudio.com
      port: 443
    - host: az764295.vo.msecnd.net
      port: 443
    - host: vscode.download.prss.microsoft.com
      port: 443
    - host: marketplace.visualstudio.com
      port: 443
    - host: gallerycdn.vsassets.io
      port: 443
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/wget
    - path: /sandbox/.vscode-server/**
    - path: /sandbox/.vscode-remote-containers/**
  # ---- Sprint M2 channels ----
  # Slack channel — slack-bolt Socket Mode (outbound WSS only; no public
  # endpoint required from the sandbox). See docs/architecture/slack-app-
  # manifest.md and ADR 024.
  slack:
    name: slack
    endpoints:
    - host: slack.com
      port: 443
    - host: wss-primary.slack.com
      port: 443
    - host: "**.slack.com"
      port: 443
    - host: files.slack.com
      port: 443
    binaries:
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.venv/bin/python3
  # AgentMail channel — agentmail Python SDK (outbound WSS to ws.agentmail.to
  # plus REST to api.agentmail.to). See ADR 024.
  agentmail:
    name: agentmail
    endpoints:
    - host: ws.agentmail.to
      port: 443
    - host: api.agentmail.to
      port: 443
    binaries:
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.venv/bin/python3
